name: hydrate_sir
description: "An offline water reminder, served by your butler."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7
  # Exact Flutter version for reproducible builds. CI reads this too.
  flutter: 3.47.9

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  fonts:
    # Variable font: weights are applied via FontVariation in lib/app/theme.
    - family: LibreCaslon
      fonts:
        - asset: assets/fonts/libre-caslon-text/LibreCaslonText-VF.ttf
        - asset: assets/fonts/libre-caslon-text/LibreCaslonText-Italic-VF.ttf
          style: italic
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/courier-prime/CourierPrime-Regular.ttf
        - asset: assets/fonts/courier-prime/CourierPrime-Bold.ttf
          weight: 700
